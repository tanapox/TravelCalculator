; Soglie cumulative di monete guadagnate per avanzare di livello.
; Il livello 1 parte da 0. L2 = monete totali necessarie per salire a livello 2, ecc.
; Modifica questi valori per bilanciare la progressione.

[terrain]

; Numero massimo assoluto di righe (dimensione dell'array). Non modificare senza
; aumentare anche i valori in [terrain_rows].
rows = 20

[terrain_rows]

; Numero di righe attive per ogni livello del giocatore.
; Al livello L, il terreno ha al massimo terrain_rows[L] righe visibili.
; All'interno del round N vengono mostrate min(N, terrain_rows[L]) righe.
; Con CELL=4px ogni riga è alta 4px. Il terreno parte da metà area (y=120).
