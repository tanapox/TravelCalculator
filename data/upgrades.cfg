; Mappa dei potenziamenti.
; Ogni sezione è un nodo dell'albero.
; Campi:
;   name      = nome visualizzato
;   desc      = descrizione effetto
;   max_level = livello massimo acquistabile
;   costs     = array di costi [lv1, lv2, ..., lv_max]   (deve avere max_level elementi)
;   connect   = array di id collegati (max 4), usato per disegnare l'albero
;   grid_x    = colonna nella griglia visuale (0 = sinistra)
;   grid_y    = riga nella griglia visuale   (0 = in alto)
;
; Layout griglia:
;
;   (0,0) weapon_power ── (1,0) fire_rate ── (2,0) penetration
;        │                      │                      │
;   (0,1) critical ────── (1,1) launchers ────── (2,1) slots
;        │                      │
;   (0,2) worm_power ──── (1,2) multiplier
;

[weapon_power]
name      = "Potenza Armi"
desc      = "Danno di tutte le armi +25% per livello"
max_level = 10
costs     = [50, 120, 250, 500, 1000, 2000, 4000, 8000, 16000, 32000]
connect   = ["fire_rate", "critical"]
grid_x    = 0
grid_y    = 0

[fire_rate]
name      = "Cadenza di Fuoco"
desc      = "Velocità proiettili e raffica +20% per livello"
max_level = 8
costs     = [80, 160, 320, 650, 1300, 2500, 5000, 10000]
connect   = ["weapon_power", "penetration", "launchers"]
grid_x    = 1
grid_y    = 0

[penetration]
name      = "Perforazione"
desc      = "HP celle terreno -15% per livello"
max_level = 5
costs     = [150, 350, 750, 1800, 4000]
connect   = ["fire_rate", "slots"]
grid_x    = 2
grid_y    = 0

[critical]
name      = "Colpi Critici"
desc      = "Probabilità di infliggere 3× il danno"
max_level = 5
costs     = [200, 500, 1200, 3000, 8000]
connect   = ["weapon_power", "launchers", "worm_power"]
grid_x    = 0
grid_y    = 1

[launchers]
name      = "Basi di Lancio"
desc      = "+2 posizioni di tiro aggiuntive per livello"
max_level = 3
costs     = [300, 1500, 6000]
connect   = ["fire_rate", "critical", "slots", "multiplier"]
grid_x    = 1
grid_y    = 1

[slots]
name      = "Slot Aggiuntivi"
desc      = "+3 caselle nella zona raccolta per livello"
max_level = 3
costs     = [500, 2000, 8000]
connect   = ["penetration", "launchers", "multiplier"]
grid_x    = 2
grid_y    = 1

[worm_power]
name      = "Potenza Verme"
desc      = "Verme con più passi e raggio di mangiatura"
max_level = 4
costs     = [250, 600, 1500, 4000]
connect   = ["critical", "multiplier"]
grid_x    = 0
grid_y    = 2

[multiplier]
name      = "Moltiplicatori"
desc      = "Tutti i moltiplicatori degli slot scalati"
max_level = 5
costs     = [400, 1000, 2500, 6000, 15000]
connect   = ["launchers", "slots", "worm_power"]
grid_x    = 1
grid_y    = 2
